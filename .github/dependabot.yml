version: 2
updates:
  # /server-config には Dockerfile が無く、イメージは docker-compose.yml に書いてあるので
  # "docker" ではなく "docker-compose"（"docker" は dependency_file_not_found で毎週失敗していた）。
  # 注意: マージしても本番には反映されない。サーバーで setup.sh を流すまで旧版のまま動く
  # （2026-10-18 湧心くん判断: リポと本番の版がずれることを承知で監視を再開）。
  - package-ecosystem: "docker-compose"
    directory: "/server-config"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # bun.lock で管理しているので "npm" ではなく "bun"（"npm" だと 2026-10-01 から
  # misconfigured_tooling で毎週失敗していた）
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # vitest 本体と @vitest/* は peer をバージョン厳密指定するため 1 PR にまとめる
      # (別 PR に分かれると 1 本ずつではマージできない)。
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
