name: Deploy n8n Workflows

on:
  push:
    branches: [main]
    paths: ['workflows/**', 'scripts/**', 'types/**']
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy all workflows (not just changed ones)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate workflows
        run: python tests/validate_workflows.py

      - name: Lint executeOnce / retryOnFail (Q5)
        run: python scripts/lint_execute_once.py

      - name: Deploy workflows
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          DEPLOY_ALL: ${{ github.event.inputs.deploy_all || 'false' }}
          DEPLOYED_LIST: deployed_files.txt
        run: |
          chmod +x scripts/deploy.sh
          bash scripts/deploy.sh

      - name: Smoke test (post-deploy verification)
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          sleep 10
          if [ -s deployed_files.txt ]; then
            python scripts/smoke_test.py --only-file deployed_files.txt
          else
            echo "No files deployed, skipping smoke test"
          fi
