name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest
        run: npx vitest run

      - name: Biome check
        run: npx biome check .

      - name: Ruff check
        run: |
          pip install ruff
          ruff check .

      - name: Validate workflows
        run: python tests/validate_workflows.py
