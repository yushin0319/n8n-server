name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Vitest
        run: bunx vitest run

      - name: Biome check
        run: bunx biome check .

      - name: Ruff check
        run: |
          pip install ruff
          ruff check .

      - name: Validate workflows
        run: python tests/validate_workflows.py

      - name: Lint executeOnce / retryOnFail (Q5)
        run: python scripts/lint_execute_once.py
