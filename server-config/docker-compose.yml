# Compose プロジェクト名を n8n-docker に固定。これは既存 OCI 上のプロジェクト名
# （旧 ~/n8n-docker/docker-compose.yml 由来）と一致させ、既存の n8n_data ボリュームを
# 継承するための措置。旧ディレクトリ廃止後も名前は維持する。
name: n8n-docker

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://yushin-n8n.duckdns.org/
      N8N_EDITOR_BASE_URL: https://yushin-n8n.duckdns.org
      GENERIC_TIMEZONE: Asia/Tokyo
      N8N_SECURE_COOKIE: true
      N8N_PROXY_HOPS: 1
      # Prometheus metrics endpoint /metrics を有効化（Q3 観測性強化）
      # localhost:5678/metrics のみアクセス可（nginx は /webhook/ と / のみ proxy）
      N8N_METRICS: "true"
      # 一時的: metrics endpoint mount 過程を追うため debug ログ。原因特定後に削除。
      N8N_LOG_LEVEL: "debug"
    volumes:
      - n8n_data:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 512M

  # Uptime Kuma: heartbeat / HTTP uptime / DNS / TCP を1画面で統合（L16）
  # サブパス /kuma/ で nginx 経由公開。初回は /kuma/ にアクセスして管理者ユーザー登録
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  n8n_data:
  uptime_kuma_data:
