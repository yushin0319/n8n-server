# Compose プロジェクト名を n8n-docker に固定。これは既存 OCI 上のプロジェクト名
# （旧 ~/n8n-docker/docker-compose.yml 由来）と一致させ、既存の n8n_data ボリュームを
# 継承するための措置。旧ディレクトリ廃止後も名前は維持する。
name: n8n-docker

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://yushin-n8n.duckdns.org/
      N8N_EDITOR_BASE_URL: https://yushin-n8n.duckdns.org
      GENERIC_TIMEZONE: Asia/Tokyo
      N8N_SECURE_COOKIE: true
      N8N_PROXY_HOPS: 1
      # 実行タイムアウト: zombie 化時に unfinished execution が積み上がって
      # 再起動時 OOM を引き起こす問題の緩和 (2026-05-03 21,312件 OOM 障害)。
      # 1時間以上かかる WF は存在しないため 3600s を上限にする。
      N8N_EXECUTION_TIMEOUT: "3600"
      # n8n 内部の execution 自動 prune (Notion #560)。5/2 prune 後 1週間で
      # SQLite DB 151MB→264MB 再肥大、execution_data が 78%(208MB) を占有し
      # container memory_limit 512MB に対して page cache 枯渇 → swap → cron skip
      # 610分の真因の一つ。archive WF は limit=250 取りこぼしで補い切れないため
      # n8n 側で 7 日超を自動削除させる。SQLite ファイル自体は VACUUM 無しでは
      # 縮まないので、初回 prune 後の VACUUM は別タスク (A1.Flex 移行後を予定)。
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"            # 7 日 (時間単位)
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"  # 件数キャップ (期間優先、件数は安全網)
      # Prometheus metrics endpoint /metrics を有効化（Q3 観測性強化）
      # localhost:5678/metrics のみアクセス可（nginx は /webhook/ と / のみ proxy）
      # NOTE: env 設定済みだが n8n v2.17.7 で /metrics は 404 を返す状況を確認。
      # 別タスク (Q3a) で原因調査予定。env 自体は将来の解決時のため残す。
      N8N_METRICS: "true"
      # Sentry backend error reporting (L15-extra 観測性強化)。n8n プロセスの
      # uncaught exception / 起動時クラッシュ / task-runner エラー等を Sentry に
      # 自動送信する。実装: packages/@n8n/config/src/configs/sentry.config.ts
      # 認証情報は host の .env に記載:
      #   N8N_SENTRY_DSN=https://<key>@<id>.ingest.<region>.sentry.io/<project>
      # 未設定時は空文字 → Sentry SDK は init をスキップ（fail-safe）。
      N8N_SENTRY_DSN: ${N8N_SENTRY_DSN:-}
      # EventLoopBlocked 検出閾値 (ms)。デフォルト 500ms は Web app 業界の異常値だが
      # n8n + OCI Always Free Micro (1 OCPU/1GB) では構造的に頻発するため alert
      # fatigue の元。2000ms に緩和して「本当に深刻なブロック」だけ拾う (#546)。
      # 値は packages/@n8n/config/src/configs/sentry.config.ts の eventLoopBlockThreshold
      # に対応 (z.number().int().positive())。A1-flex 移行後は 500ms に戻す検討。
      N8N_SENTRY_EVENT_LOOP_BLOCK_THRESHOLD: "2000"
      # Healthchecks.io Slug ping key (A7 cron 実行欠落リアルタイム検知)。各 cron WF
      # 末尾の PingHealthchecks ノードが {{ $env.HC_PING_KEY }} で参照する。
      # 未設定時は ping URL が hc-ping.com//slug となり 404 → ping 不達 → 通知発火。
      # host の .env に HC_PING_KEY=<32文字英数> を記載すること。
      HC_PING_KEY: ${HC_PING_KEY:-}
      # n8n v2 デフォルトで Code Node / expression からの $env アクセスがブロック
      # される (N8N_BLOCK_ENV_ACCESS_IN_NODE=true)。HC_PING_KEY を URL expression で
      # 参照するために false へ。Code Node 側で $env 参照は現状 0 件のため影響なし。
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      # 観測性ログ統一エンドポイント api/obs-notify (#529) の Discord channel 別
      # webhook URL。SendDiscord ノードが {{ $env.OBS_WEBHOOK_<SEVERITY>_URL }} で
      # severity (critical/warning/info) 別 channel に振り分ける。
      # host の .env に OBS_WEBHOOK_INFO_URL / OBS_WEBHOOK_WARNING_URL /
      # OBS_WEBHOOK_CRITICAL_URL を記載すること。未設定時は SendDiscord が空 URL で
      # 失敗するが neverError=true で WF は止まらない（Notion DB 書き込みは継続）。
      OBS_WEBHOOK_INFO_URL: ${OBS_WEBHOOK_INFO_URL:-}
      OBS_WEBHOOK_WARNING_URL: ${OBS_WEBHOOK_WARNING_URL:-}
      OBS_WEBHOOK_CRITICAL_URL: ${OBS_WEBHOOK_CRITICAL_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 512M

  # Uptime Kuma: heartbeat / HTTP uptime / DNS / TCP を1画面で統合（L16）
  # サブパス /kuma/ で nginx 経由公開。初回は /kuma/ にアクセスして管理者ユーザー登録
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M

  # Promtail: journald + docker container logs + n8n_data の WF 系 log を Grafana
  # Cloud Loki に転送する（L14 観測性強化）。
  # 認証情報は host の .env に記載:
  #   LOKI_URL=https://logs-prod-XX.grafana.net/loki/api/v1/push
  #   LOKI_USER=<numeric user id>
  #   LOKI_PASSWORD=<api key>
  # 未設定でも container は起動するが Loki への push は HTTP 401 で fail し続ける。
  # 完全に止めたければ docker compose stop promtail で OK。
  promtail:
    image: grafana/promtail:3.5.5
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml -config.expand-env=true
    environment:
      LOKI_URL: ${LOKI_URL:-https://logs-prod-001.grafana.net/loki/api/v1/push}
      LOKI_USER: ${LOKI_USER:-PLACEHOLDER}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-PLACEHOLDER}
      HOSTNAME: n8n-server
    volumes:
      - ./server-config/promtail-config.yaml:/etc/promtail/config.yaml:ro
      # Docker コンテナログ + service discovery
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # systemd journal
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # promtail の position 永続化（restart 後の重複読み回避）
      - promtail_positions:/var/promtail
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  n8n_data:
  uptime_kuma_data:
  promtail_positions:
