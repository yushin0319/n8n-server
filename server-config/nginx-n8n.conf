server {
    server_name yushin-n8n.duckdns.org;

    # Webhook endpoints - require secret header
    # 実際のシークレット値は /etc/nginx/snippets/webhook-secret.conf に定義:
    #   set $webhook_secret "YOUR_SECRET_HERE";
    location /webhook/ {
        include /etc/nginx/snippets/webhook-secret.conf;
        if ($http_x_webhook_secret != $webhook_secret) {
            return 403;
        }
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # All other paths (n8n UI, API, etc.)
    location / {
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yushin-n8n.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yushin-n8n.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80;
    server_name yushin-n8n.duckdns.org;

    # Let's Encrypt ACME challenge は HTTP のまま提供（cert renew/expand 用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# yushin-kuma.duckdns.org（Uptime Kuma）: HTTP server block。
# ACME challenge を受けつつ、その他は HTTPS にリダイレクト。
server {
    listen 80;
    server_name yushin-kuma.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# yushin-kuma.duckdns.org: HTTPS server block（Uptime Kuma へ proxy）。
# cert は yushin-n8n.duckdns.org の cert を SAN 追加で共有（certbot --expand 済み）。
# Kuma v1 は sub-path 非対応のため別ドメイン構成。WebSocket が必須。
server {
    listen 443 ssl;
    server_name yushin-kuma.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/yushin-n8n.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yushin-n8n.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
