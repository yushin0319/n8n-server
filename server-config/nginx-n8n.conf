# #529 SaaS adapter (obs-from-*) は X-Webhook-Secret 検証なしで外部公開するため、
# DDoS リスク軽減のため per-IP rate limit を設定する。SaaS の通常通知は分単位なので
# 5r/s (burst 10) で十分余裕、bot 系攻撃は遮断できる。
limit_req_zone $binary_remote_addr zone=obs_from:10m rate=5r/s;

server {
    server_name yushin-n8n.duckdns.org;

    # Prometheus /metrics - require same webhook secret header
    # 認証なしで公開すると WF 名・実行回数等がリークするのでガードする
    location = /metrics {
        include /etc/nginx/snippets/webhook-secret.conf;
        if ($http_x_webhook_secret != $webhook_secret) {
            return 403;
        }
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SaaS adapter endpoints (#529): X-Webhook-Secret なしで外部 SaaS から叩ける。
    # Sentry / Uptime Kuma は webhook header カスタマイズ不可で、このパスは secret 検証を
    # bypass する必要がある。adapter WF 側 (api/obs-from-*) で payload 形式バリデーション
    # (severity / service / subject 必須) があるため、攻撃者がランダム JSON を投げても通
    # 過しない設計。短い同期リクエストのみで WebSocket / streaming は不要。
    location ~ ^/webhook/obs-from- {
        limit_req zone=obs_from burst=10 nodelay;
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Webhook endpoints - require secret header
    # 実際のシークレット値は /etc/nginx/snippets/webhook-secret.conf に定義:
    #   set $webhook_secret "YOUR_SECRET_HERE";
    location /webhook/ {
        include /etc/nginx/snippets/webhook-secret.conf;
        if ($http_x_webhook_secret != $webhook_secret) {
            return 403;
        }
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # All other paths (n8n UI, API, etc.)
    location / {
        proxy_pass http://localhost:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yushin-n8n.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yushin-n8n.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80;
    server_name yushin-n8n.duckdns.org;

    # Let's Encrypt ACME challenge は HTTP のまま提供（cert renew/expand 用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# yushin-kuma.duckdns.org（Uptime Kuma）: HTTP server block。
# ACME challenge を受けつつ、その他は HTTPS にリダイレクト。
server {
    listen 80;
    server_name yushin-kuma.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# yushin-kuma.duckdns.org: HTTPS server block（Uptime Kuma へ proxy）。
# cert は yushin-n8n.duckdns.org の cert を SAN 追加で共有（certbot --expand 済み）。
# Kuma v1 は sub-path 非対応のため別ドメイン構成。WebSocket が必須。
server {
    listen 443 ssl;
    server_name yushin-kuma.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/yushin-n8n.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yushin-n8n.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
