# Netdata Agent 設定 (観測性強化 L13)
# OCI Always Free Micro (1OCPU/1GB RAM + 2GB swap) 向けの低メモリチューニング。
# n8n + Uptime Kuma が docker compose で同居しており、n8n は既に swap を 365MB 程度
# 使用している前提。Netdata 自体のメモリフットプリントをできるだけ削る。
# server-config/setup.sh が /etc/netdata/netdata.conf に同期する。

[global]
    # 2 秒粒度。1 秒だと CPU 負荷が無視できない。
    update every = 2
    # メトリクスはメモリのみ保持。disk 書き込みを抑え I/O 負荷を削る。
    # 過去履歴は Netdata Cloud に転送するのでローカルの長期保存は不要。
    memory mode = ram
    # メモリ上の履歴 = 直近 1 時間分 (3600 秒)。
    history = 3600

[ml]
    # 機械学習による異常検知は数十 MB 〜数百 MB 食うため無効化。
    # 1GB RAM では割に合わない。
    enabled = no

[health]
    enabled = yes

[plugins]
    # 必須プラグインのみ有効化。
    proc = yes
    diskspace = yes
    cgroups = yes
    apps = yes
    go.d = yes
    # 不要なものを明示的に無効化（メモリ削減）
    python.d = no
    node.d = no
    charts.d = no
    ioping = no

[plugin:cgroups]
    # Docker コンテナ (n8n / kuma) のメトリクスを cgroups 経由で取得。
    enable by default cgroups matching = !*/init.scope *.scope *docker* *kubepods* !*
