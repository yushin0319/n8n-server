# Netdata Agent 設定 (観測性強化 L13)
# OCI Always Free Micro (1OCPU/1GB RAM + 2GB swap) 向けの低メモリチューニング。
# n8n + Uptime Kuma が docker compose で同居しており、n8n は既に swap を 365MB 程度
# 使用している前提。Netdata 自体のメモリフットプリントをできるだけ削る。
# server-config/setup.sh が /etc/netdata/netdata.conf に同期する。
#
# 2026-05-03: Netdata Cloud trial が 5/9 で切れるため、ローカル dbengine で長期保持に切替。
# n8n が 5/2 09:00 JST から zombie 化したインシデント調査時、過去 4 時間以上のメモリ推移が
# 取得できず原因特定不能だった (history=3600 の影響)。dbengine + 512MB ディスクで約 2-4 週間保持。

[global]
    # 2 秒粒度。1 秒だと CPU 負荷が無視できない。
    update every = 2

[db]
    # dbengine: ディスクに圧縮して長期保存。ram モードと違いプロセス再起動で消えない。
    mode = dbengine
    # 単一 tier (2 秒粒度のみ)。tier 0 だけで十分長期保持できる試算。
    storage tiers = 1
    # メモリコスト: page cache 32MB + メタデータ ~10MB → 計 ~50MB。
    # 1GB RAM の n8n と競合するが、観測性失うリスクの方が高いと判断。
    dbengine page cache size MB = 32
    # ディスク容量: 1000-2000 metrics × 2sec → 圧縮込で ~25-50MB/日。
    # 512MB で約 10-20 日保持できる見込み。実測でずれたら調整。
    dbengine multihost disk space MB = 512

[ml]
    # 機械学習による異常検知は数十 MB 〜数百 MB 食うため無効化。
    # 1GB RAM では割に合わない。
    enabled = no

[health]
    enabled = yes

[plugins]
    # 必須プラグインのみ有効化。
    proc = yes
    diskspace = yes
    cgroups = yes
    apps = yes
    go.d = yes
    # 不要なものを明示的に無効化（メモリ削減）
    python.d = no
    node.d = no
    charts.d = no
    ioping = no

[plugin:cgroups]
    # Docker コンテナ (n8n / kuma) のメトリクスを cgroups 経由で取得。
    enable by default cgroups matching = !*/init.scope *.scope *docker* *kubepods* !*
