# /etc/netdata/health_alarm_notify.conf
# Override for #586: netdata agent → obs-from-netdata adapter WF
#
# netdata loads this AFTER /usr/lib/netdata/conf.d/health_alarm_notify.conf
# (in alarm-notify.sh), so only the override-needed variables and the
# custom_sender function need to be redeclared here. Defaults inherited.
#
# 設計:
#   - 重要 alarm (memory/swap/OOM/disk/reboot/hw-corrupt/tcp_memory 系) のみ
#     allowlist で許可
#   - sysadmin role の alarm を custom_sender にも dispatch
#   - dispatch 先: https://yushin-n8n.duckdns.org/webhook/obs-from-netdata
#       → obs-notify WF → Discord #obs-warning/critical + Notion 観測性 DB
#   - silent recipient の alarm は custom_sender に届かない (netdata 仕様)。
#     必要なら別途 health.d で個別 alarm の `to:` を sysadmin に上書きする
#     (本 PR では sysadmin デフォルトの 6 alarm のみ対象)

# Enable custom sender (template default = YES, redeclared for clarity)
SEND_CUSTOM="YES"

# Non-empty marker; alarm-notify.sh requires recipient list to be non-empty
DEFAULT_RECIPIENT_CUSTOM="obs"

# Route sysadmin-targeted alarms to custom_sender (in addition to original senders)
role_recipients_custom[sysadmin]="obs"

# Override custom_sender: alarm-name allowlist filter + POST to adapter WF
custom_sender() {
    case "${name}" in
        ram_in_use|ram_available|used_swap|30min_ram_swapped_out|oom_kill|disk_space_usage|out_of_disk_space_time|disk_inode_usage|out_of_disk_inodes_time|system_post_update_reboot_status|1hour_memory_hw_corrupted|tcp_memory)
            ;;
        *)
            return 0
            ;;
    esac

    # Strip double quotes from info to keep JSON valid
    local info_clean="${info//\"/}"
    local payload
    payload=$(printf '{"alarm":"%s","alarm_status":"%s","host":"%s","info":"%s","value_string":"%s","chart":"%s","class":"%s"}' \
        "${name}" "${status}" "${host}" "${info_clean}" "${value_string}" "${chart}" "${classification:-system}")

    curl -sS --max-time 10 -X POST \
        -H "Content-Type: application/json" \
        -d "${payload}" \
        https://yushin-n8n.duckdns.org/webhook/obs-from-netdata >/dev/null 2>&1
    return $?
}
